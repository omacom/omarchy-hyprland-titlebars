# Default config for omarchy-hyprland-titlebars.
#
# Floating is the one layout whose titlebars are on by default; every other
# layout defaults off. This is expressed as configuration, not hardcoded in
# the plugin: the C++ code registers every layout_<name>_enabled option with
# the same default (false).
#
# Include this file from your Hyprland config so the default applies, e.g.
#   source = /usr/share/omarchy-hyprland-titlebars/hyprbars.conf
# (in hyprland.conf) or
#   hl.config({ plugin = { hyprbars = { layout_floating_enabled = true } } })
# (in hyprland.lua). Omarchy's config already sets this; the file is the
# reference default for setups that don't.
# The file is included purely for backwards compatibility: it preserves the
# behavior of older plugin builds that hardcoded floating titlebars on by
# default. New setups can omit it and set the option explicitly.
plugin:hyprbars:layout_floating_enabled = true
